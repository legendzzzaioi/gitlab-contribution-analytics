services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gitlab_analytics}
      MYSQL_USER: ${MYSQL_USER:-analytics}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-analytics-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-secret}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./data/:/var/lib/mysql

  api:
    build: ./backend
    restart: always
    environment:
      DB_DSN: ${MYSQL_USER:-analytics}:${MYSQL_PASSWORD:-analytics-secret}@tcp(mysql:3306)/${MYSQL_DATABASE:-gitlab_analytics}?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SYNC_CRON: ${SYNC_CRON:-0 */12 * * *}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./frontend
    restart: always
    ports:
      - "8088:80"
    depends_on:
      - api
